name: IBIS Windows Package

on:
  workflow_dispatch:
  push:
    branches:
      - codex/ibis-ui-phase1-1
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ibis-windows-package-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: IBIS_Codex_READY_FOR_T2B_Package

jobs:
  linux-tests:
    name: Linux source tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Linux unit, template, robustness and UI tests
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Linux acceptance and Golden verification
        env:
          PYTHONPATH: src
        run: python tests/run_acceptance.py

      - name: Run Linux headless UI check
        env:
          PYTHONPATH: src
          IBIS_BUILD_COMMIT: ${{ github.sha }}
        run: python -m ibis_ui --check --workspace "${{ runner.temp }}/ibis-linux-workspace" --check-report "${{ runner.temp }}/ibis-linux-check.json"

      - name: Create Linux path-neutral project snapshot
        run: python packaging/cross_platform_probe.py --output build/platform-linux.json

      - name: Upload Linux compatibility snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui1-platform-linux-${{ github.run_id }}
          path: IBIS_Codex_READY_FOR_T2B_Package/build/platform-linux.json
          if-no-files-found: error

  windows-build:
    name: Windows native build and tests
    runs-on: windows-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned Windows build dependency
        run: python -m pip install --disable-pip-version-check -r packaging/requirements-build.txt

      - name: Run Windows unit, template, robustness and UI tests
        env:
          PYTHONPATH: src
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path build -Force | Out-Null
          $output = & python -m unittest discover -s tests -p "test_*.py" -v 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath build/windows-unit-tests.log
          if ($exitCode -ne 0) {
            "### Windows unit test failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build/windows-unit-tests.log -Tail 200 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $annotation = (Get-Content build/windows-unit-tests.log -Tail 30) -join "`n"
            $annotation = $annotation.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows unit test details::$annotation"
            exit $exitCode
          }

      - name: Upload Windows unit test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-unit-test-log-${{ github.run_id }}
          path: IBIS_Codex_READY_FOR_T2B_Package/build/windows-unit-tests.log
          if-no-files-found: error

      - name: Run Windows acceptance and Golden verification
        env:
          PYTHONPATH: src
          PYTHONUTF8: "1"
        shell: pwsh
        run: |
          $output = & python tests/run_acceptance.py 2>&1
          $exitCode = $LASTEXITCODE
          $output | Tee-Object -FilePath build/windows-acceptance.log
          if ($exitCode -ne 0) {
            "### Windows acceptance failure" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```text' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build/windows-acceptance.log -Tail 200 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            $annotation = (Get-Content build/windows-acceptance.log -Tail 40) -join "`n"
            $annotation = $annotation.Replace("%", "%25").Replace("`r", "%0D").Replace("`n", "%0A")
            Write-Output "::error title=Windows acceptance details::$annotation"
            exit $exitCode
          }

      - name: Upload Windows acceptance log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance-log-${{ github.run_id }}
          path: IBIS_Codex_READY_FOR_T2B_Package/build/windows-acceptance.log
          if-no-files-found: error

      - name: Create Windows path-neutral project snapshot
        run: python packaging/cross_platform_probe.py --output build/platform-windows.json

      - name: Build native Windows onedir package
        run: python packaging/build_windows.py --commit "${{ github.sha }}"

      - name: Verify package structure
        shell: pwsh
        run: |
          $package = Join-Path $PWD "dist/IBIS_Automation_Windows_UI1_1"
          $required = @(
            "IBIS_Automation.exe",
            "_internal",
            "README.txt",
            "_internal/resources/build_info.json",
            "_internal/resources/inputs/config/ibis_config.xlsx",
            "_internal/resources/templates/t2b/_t2b_config.ini",
            "_internal/resources/templates/t2b/drv_diff.t2b",
            "_internal/resources/templates/t2b/drv_se.t2b",
            "_internal/resources/templates/t2b/rcv_diff.t2b",
            "_internal/resources/templates/t2b/rcv_se.t2b"
          )
          foreach ($relative in $required) {
            $target = Join-Path $package $relative
            if (-not (Test-Path $target)) { throw "Missing package resource: $target" }
          }
          if (-not (Test-Path "dist/IBIS_Automation_Windows_UI1_1.zip")) { throw "Windows ZIP missing" }

      - name: Run packaged EXE headless check
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/IBIS_Automation_Windows_UI1_1/IBIS_Automation.exe"
          $workspace = Join-Path $env:RUNNER_TEMP "ibis-exe-workspace"
          $report = Join-Path $env:RUNNER_TEMP "ibis-exe-check.json"
          $process = Start-Process -FilePath $exe -ArgumentList @("--check", "--workspace", $workspace, "--check-report", $report) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "EXE headless check failed with exit code $($process.ExitCode)" }
          if (-not (Test-Path $report)) { throw "EXE headless report missing" }
          $result = Get-Content $report -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($result.status -ne "PASS") { throw "EXE headless status is not PASS" }
          if ($result.mode -ne "HEADLESS" -or $result.gui_window_created -ne $false) { throw "Headless/GUI status is inaccurate" }
          if ($result.frozen -ne $true) { throw "Packaged runtime did not report frozen=true" }
          if ($result.git_commit -ne $env:GITHUB_SHA) { throw "Embedded commit does not match workflow commit" }
          "Headless EXE check: PASS" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Run real Tk window smoke test
        id: gui-smoke
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = Join-Path $PWD "dist/IBIS_Automation_Windows_UI1_1/IBIS_Automation.exe"
          $workspace = Join-Path $env:RUNNER_TEMP "ibis-exe-gui-workspace"
          $process = Start-Process -FilePath $exe -ArgumentList @("--smoke-test", "--workspace", $workspace) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Tk window smoke failed with exit code $($process.ExitCode)" }
          "Real Tk window smoke: PASS (Demo main window, Config scroll, template and MSI/SPF previews created; auto-closed; visual inspection not performed)" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Record GUI smoke distinction
        if: always()
        shell: pwsh
        run: |
          if ("${{ steps.gui-smoke.outcome }}" -eq "success") {
            "GUI smoke result: PASS. This is not a human visual acceptance test." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          } else {
            "GUI smoke result: NOT VERIFIED in CI. Headless EXE validation remains separate and passed before artifact upload." | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          }

      - name: Upload Windows compatibility snapshot
        uses: actions/upload-artifact@v4
        with:
          name: ui1-platform-windows-${{ github.run_id }}
          path: IBIS_Codex_READY_FOR_T2B_Package/build/platform-windows.json
          if-no-files-found: error

      - name: Upload downloadable Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: IBIS_Automation_Windows_UI1_1
          # GitHub creates the downloadable artifact ZIP. Uploading the onedir
          # contents avoids a ZIP-inside-ZIP and makes one extraction sufficient.
          path: IBIS_Codex_READY_FOR_T2B_Package/dist/IBIS_Automation_Windows_UI1_1/
          if-no-files-found: error
          compression-level: 6
          retention-days: 30

  compatibility-check:
    name: Compare Windows and Linux project data
    runs-on: ubuntu-latest
    needs:
      - linux-tests
      - windows-build
    steps:
      - name: Download Linux snapshot
        uses: actions/download-artifact@v4
        with:
          name: ui1-platform-linux-${{ github.run_id }}
          path: linux

      - name: Download Windows snapshot
        uses: actions/download-artifact@v4
        with:
          name: ui1-platform-windows-${{ github.run_id }}
          path: windows

      - name: Compare path-neutral JSON exactly
        run: |
          cmp linux/platform-linux.json windows/platform-windows.json
          echo "Windows/Linux Project Schema and Config snapshot: PASS" >> "$GITHUB_STEP_SUMMARY"
        working-directory: ${{ github.workspace }}
